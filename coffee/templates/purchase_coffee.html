<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Purchase Coffee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!--Navigation bar.  This is the same across all my pages-->

    <nav class="navbar navbar-dark bg-dark px-3 mb-4">
        <div class="d-flex align-items-center gap-3">
            <a class="navbar-brand" href="{% url 'home' %}">Maven Coffee Roasters</a>
            <a class="navbar-brand" href="{% url 'transaction_list' %}">Transaction History</a>
            <a class="navbar-brand" href="{% url 'purchase_coffee' %}">Purchase Coffee</a>
            <a class="navbar-brand" href="{% url 'add_product' %}">Add Product</a>
            <a class="navbar-brand" href="{% url 'sales_dashboard' %}">Sales Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Purchase Coffee</h2>

        <form method="post" action="{% url 'purchase_coffee' %}">
            {% csrf_token %}
            
            <!--User chooses store to purchase from-->
            <div class="row align-items-end gx-3">
            <div class="col-md-3 mb-3">
                <label for="storeLocation" class="form-label">Store Location</label>
                <select class="form-select" id="storeLocation" name="storeLocation" required>
                    <option value="">Select Store</option>
                    {% for store in stores %}
                        <option value="{{ store.storeLocation }}">{{ store.storeLocation }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <!--User chooses from the list of products - product category, type, and detail are concatendated together -->
            <div class="col-md-3 mb-3">
                <label for="productDetail" class="form-label">Product</label>
                <select class="form-select" id="productDetail" name="productDetail">
                    <option value="">Select a product</option>
                    {% for product in products %}
                        <option value="{{ product.productDetail }}" {% if request.POST.productDetail == product.productDetail %}selected{% endif %}>
                            {{ product.productCategory }} - {{ product.productType }} - {{ product.productDetail }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-3 mb-3">
                <label for="quantity" class="form-label">Quantity</label>
                <input type="number" class="form-control" id="quantity" name="quantity" min="1" required>
            </div>
            <div class="col-md-12">
                <button type="submit" class="btn btn-success">Purchase</button>
            </div>
            </div>
        </form>
    </div>

</body>
</html>
